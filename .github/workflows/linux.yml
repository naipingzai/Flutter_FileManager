name: Build Linux

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build libgtk-3-dev libssl-dev zlib1g-dev pkg-config
      - name: Get deps
        run: flutter pub get
      - name: Build
        run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist/linux
          cp -r build/linux/x64/release/bundle/* dist/linux/
          cd dist/linux && tar czf ../flutter_file_manager-linux.tar.gz . && cd ../..
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/flutter_file_manager-linux.tar.gz
