name: Build All Platforms

# 触发条件：main/master/develop 的 push / PR，或手动 workflow_dispatch
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Flutter 版本：须与 pubspec.yaml 的 sdk 约束 ^3.12.2（Dart 3.12）匹配。
env:
  FLUTTER_VERSION: 3.44.4

jobs:
  # ============================================================
  # Linux —— 编译 x86_64 release 二进制
  # FFmpeg：系统预编译包（apt libav*-dev），不本地编译源码
  # ============================================================
  linux:
    name: Linux (binary)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build pkg-config make tar curl \
            libgtk-3-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare native assets dir
        run: mkdir -p build/native_assets/linux

      - name: Build Linux release
        run: flutter build linux --release

      - name: Verify binary
        run: |
          test -f build/linux/x64/release/bundle/flutter_file_manager
          file build/linux/x64/release/bundle/flutter_file_manager

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-linux-x86_64
          path: build/linux/x64/release/bundle/
          retention-days: 14

  # ============================================================
  # Android —— 编译 fat APK
  # FFmpeg：下载预编译各 ABI 静态库 -> FFMPEG_DIR (lib/<abi>/libav*.a)
  # ============================================================
  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download prebuilt FFmpeg (Android)
        run: |
          mkdir -p ${{ runner.temp }}/ffmpeg/android/lib
          # TODO: 从预编译 FFmpeg 发布源下载各 ABI 静态库并解压到:
          #   ${{ runner.temp }}/ffmpeg/android/lib/<abi>/libav*.a
          echo "::error::Android 预编译 FFmpeg 尚未配置下载源，请补充"
          exit 1

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (fat)
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg/android
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================
  # Windows —— 编译 x64 EXE
  # FFmpeg：下载预编译 MSVC 库 -> FFMPEG_DIR (lib/av*.lib)
  # ============================================================
  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download prebuilt FFmpeg (Windows MSVC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\ffmpeg" | Out-Null
          # TODO: 从预编译 FFmpeg(MSVC) 发布源下载并解压到 ${{ runner.temp }}\ffmpeg
          #   需含 include/ 与 lib/avformat.lib, lib/avcodec.lib 等
          Write-Error "Windows 预编译 FFmpeg 尚未配置下载源，请补充"
          exit 1

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        env:
          FFMPEG_DIR: ${{ runner.temp }}\ffmpeg
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14

  # ============================================================
  # iOS —— 编译未签名 IPA
  # FFmpeg：build_ios_native.sh 下载预编译 iOS 库并编译 core/media
  # ============================================================
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Ruby (CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app 2>/dev/null || true
          xcodebuild -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Download prebuilt FFmpeg (iOS)
        run: |
          mkdir -p build/native/ios/ffmpeg/lib build/native/ios/ffmpeg/include
          # TODO: 从预编译 iOS FFmpeg 发布源下载并解压到 build/native/ios/ffmpeg
          #   需含 include/ 与 lib/libavformat.a, lib/libavcodec.a 等
          echo "::error::iOS 预编译 FFmpeg 尚未配置下载源，请补充"
          exit 1

      - name: Build iOS (release, 不签名)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload ios_unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry ios_unsigned.ipa Payload
          rm -rf Payload
          file ios_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-ios-unsigned-ipa
          path: build/ios/iphoneos/ios_unsigned.ipa
          retention-days: 14

  # ============================================================
  # 构建结果汇总
  # ============================================================
  summarize:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [linux, android, windows, ios]
    if: always()
    steps:
      - run: |
          echo "## 各平台构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 产物 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | 二进制 | ${{ needs.linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | APK | ${{ needs.android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | EXE | ${{ needs.windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | 未签名 IPA | ${{ needs.ios.result }} |" >> $GITHUB_STEP_SUMMARY
