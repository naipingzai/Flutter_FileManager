name: Build All Platforms

# 在 master/main 分支 push 或 PR 时触发
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Linux: 编译二进制 release 包
  # ============================================================
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libssl-dev zlib1g-dev

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare native assets directory
        run: mkdir -p build/native_assets/linux

      - name: Build Linux (Release)
        run: flutter build linux --release

      - name: Verify binary
        run: |
          test -f build/linux/x64/release/bundle/flutter_file_manager
          ls -la build/linux/x64/release/bundle/flutter_file_manager
          file build/linux/x64/release/bundle/flutter_file_manager

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-linux-x86_64
          path: build/linux/x64/release/bundle/
          retention-days: 14

  # ============================================================
  # Android: 编译 APK（arm64-v8a + armeabi-v7a + x86_64）
  # ============================================================
  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release, fat APK 含所有 ABI)
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================
  # Windows: 编译 EXE
  # ============================================================
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\flutter_file_manager.exe"
          Test-Path $exe
          Get-Item $exe | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14

  # ============================================================
  # iOS: 编译未签名 IPA（无需 Apple 开发者证书）
  # ============================================================
  ios:
    name: iOS (Unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app
          xcodebuild -version
          pod --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (unsigned, no codesign)
        run: |
          flutter build ios --release --no-codesign --export-options-plist=ios/ExportOptions.plist

      - name: Create unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r ../../../flutter-file-manager-unsigned.ipa Payload
          cd ../../..
          ls -la flutter-file-manager-unsigned.ipa
          file flutter-file-manager-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: flutter-file-manager-ios-unsigned-ipa
          path: flutter-file-manager-unsigned.ipa
          retention-days: 14

  # ============================================================
  # 编译完成后的总结
  # ============================================================
  summarize:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [linux, android, windows, ios]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Build Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux |   ${{ needs.linux.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | ${{ needs.windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS |     ${{ needs.ios.result }}     |" >> $GITHUB_STEP_SUMMARY
